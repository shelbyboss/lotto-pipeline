name: Daily data update

on:
  schedule:
    # 22:10 Bangkok (after Lao ~20:30 draw and Thai results are published)
    - cron: "10 15 * * *"
    # 07:10 Bangkok safety re-run, catches results published late
    - cron: "10 0 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "Re-check from date (YYYY-MM-DD), blank = incremental"
        required: false

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Unit tests (parsers)
        run: python -m pytest -q

      - name: Fetch new draws + rebuild stats
        run: |
          if [ -n "${{ github.event.inputs.since }}" ]; then
            python -m pipeline.update --since "${{ github.event.inputs.since }}"
          else
            python -m pipeline.update
          fi

      - name: Commit if data changed
        run: |
          git config user.name  "lotto-bot"
          git config user.email "lotto-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet -- docs/data/thai.csv docs/data/lao.csv; then
            echo "No new draws"
          else
            git commit -m "data: update $(TZ=Asia/Bangkok date +%F)"
            git push
          fi
